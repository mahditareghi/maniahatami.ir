<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="60%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" filter="url(#shadowFilter)"/>
  
  <!-- Outer White Ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#ffffff" stroke-width="7"/>

  <!-- Pin Nails / Dots Around the Perimeter (28 dots) -->
  <g fill="#ffffff">
    <circle cx="250.0" cy="60.0" r="7.5" />
    <circle cx="292.6" cy="64.8" r="7.5" />
    <circle cx="332.9" cy="78.9" r="7.5" />
    <circle cx="368.6" cy="101.5" r="7.5" />
    <circle cx="397.6" cy="131.4" r="7.5" />
    <circle cx="418.1" cy="167.3" r="7.5" />
    <circle cx="428.8" cy="207.2" r="7.5" />
    <circle cx="428.8" cy="248.8" r="7.5" />
    <circle cx="418.1" cy="288.7" r="7.5" />
    <circle cx="397.6" cy="324.6" r="7.5" />
    <circle cx="368.6" cy="354.5" r="7.5" />
    <circle cx="332.9" cy="377.1" r="7.5" />
    <circle cx="292.6" cy="391.2" r="7.5" />
    <circle cx="250.0" cy="396.0" r="7.5" />
    <circle cx="207.4" cy="391.2" r="7.5" />
    <circle cx="167.1" cy="377.1" r="7.5" />
    <circle cx="131.4" cy="354.5" r="7.5" />
    <circle cx="102.4" cy="324.6" r="7.5" />
    <circle cx="81.9" cy="288.7" r="7.5" />
    <circle cx="71.2" cy="248.8" r="7.5" />
    <circle cx="71.2" cy="207.2" r="7.5" />
    <circle cx="81.9" cy="167.3" r="7.5" />
    <circle cx="102.4" cy="131.4" r="7.5" />
    <circle cx="131.4" cy="101.5" r="7.5" />
    <circle cx="167.1" cy="78.9" r="7.5" />
    <circle cx="207.4" cy="64.8" r="7.5" />
  </g>

  <!-- Central Persian Artistic Calligraphy "مانیا" -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Ribbon Calligraphy -->
    <path d="M 165 240 L 165 145 C 165 130 175 130 185 145 L 222 215 C 228 225 238 225 244 215 L 272 155 C 280 140 298 140 302 165 C 308 200 285 245 235 245 L 210 245 C 190 245 170 248 150 262 C 142 268 142 278 152 278 L 330 278 C 342 278 348 270 348 255 L 348 215" 
          stroke-width="19" filter="url(#subtleGlow)"/>
  </g>

  <!-- Diamond Dots for Persian Letters -->
  <!-- Top dot for ن -->
  <polygon points="257,112 269,124 257,136 245,124" fill="#ffffff" filter="url(#subtleGlow)"/>
  
  <!-- Bottom two dots for ی -->
  <polygon points="172,254 183,265 172,276 161,265" fill="#ffffff" filter="url(#subtleGlow)"/>
  <polygon points="199,254 210,265 199,276 188,265" fill="#ffffff" filter="url(#subtleGlow)"/>

  <!-- English Subtitle: • Mania Hatamy • -->
  <text x="250" y="342" 
        text-anchor="middle" 
        font-family="'Readex Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="33" 
        fill="#ffffff" 
        letter-spacing="1">• Mania Hatamy •</text>
</svg>
